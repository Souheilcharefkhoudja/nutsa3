  wilayaSel.addEventListener('change', function() {
    const code = wilayaSel.value;
    const list = (communesData[code] || []).slice().sort(function(a, b) {
      return a.localeCompare(b, 'fr');
    });

    communeSel.innerHTML = '';
    if(list.length === 0) {
      communeSel.disabled = true;
      const o = document.createElement('option');
      o.value = ''; o.textContent = 'Aucune commune';
      o.disabled = true; o.selected = true;
      communeSel.appendChild(o);
      return;
    }

      communeSel.appendChild(o);
